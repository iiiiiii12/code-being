<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temporal Cracks - Reverse Time Engine</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      text-align: center;
      margin-top: 50px;
    }
    canvas {
      background: #111;
      display: block;
      margin: 30px auto;
      border: 2px solid white;
    }
    h1 {
      color: cyan;
    }
  </style>
</head>
<body>
  <h1>🕰️ Temporal Cracks</h1>
  <p>A world where causes follow effects</p>
  <canvas id="world" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById('world');
    const ctx = canvas.getContext('2d');

    class Particle {
      constructor(x, y, vx, vy, color) {
        this.positions = [{ x, y }];
        this.vx = vx;
        this.vy = vy;
        this.color = color;
      }

      update(reverse = false) {
        const last = this.positions[this.positions.length - 1];
        const newPos = {
          x: last.x + (reverse ? -this.vx : this.vx),
          y: last.y + (reverse ? -this.vy : this.vy)
        };
        this.positions.push(newPos);
        if (this.positions.length > 200) this.positions.shift();
      }

      draw(ctx) {
        ctx.beginPath();
        for (let i = 0; i < this.positions.length; i++) {
          const { x, y } = this.positions[i];
          ctx.lineTo(x, y);
        }
        ctx.strokeStyle = this.color;
        ctx.stroke();
      }
    }

    let particles = [
      new Particle(100, 200, 2, 0.5, 'lime'),
      new Particle(500, 200, -2, -0.5, 'magenta'),
    ];

    let time = 0;
    let reverse = false;

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (time % 300 === 0) reverse = !reverse; // every 300 frames, reverse time

      for (let p of particles) {
        p.update(reverse);
        p.draw(ctx);
      }

      ctx.fillStyle = 'white';
      ctx.fillText("Time: " + time + " → " + (reverse ? "⏪ Reverse" : "▶️ Forward"), 10, 20);
      time += (reverse ? -1 : 1);

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
